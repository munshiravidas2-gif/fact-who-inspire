<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fact Who Inspire | Official Documentary Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #E50914; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#0B0F17] text-white">
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-black/80 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-black uppercase tracking-wider">Fact Who <span class="text-[#E50914]">Inspire</span></h1>
            <a href="https://youtube.com/@factwhoinspire" target="_blank" class="bg-[#E50914] px-5 py-2 rounded-full text-sm font-bold">SUBSCRIBE</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-32 pb-20 px-6 max-w-6xl mx-auto">
        <h2 class="text-3xl font-bold mb-8">Latest Documentaries</h2>
        
        <!-- Loading Spinner -->
        <div id="loader" class="flex justify-center py-20"><div class="loader"></div></div>
        
        <!-- Video Grid -->
        <div id="video-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <script>
        const CHANNEL_ID = 'UCs-M_dAtuQ-513W1937iGjQ';
        const videoGrid = document.getElementById('video-grid');
        const loader = document.getElementById('loader');

        async function fetchVideos() {
            try {
                // Using rss2json API to fetch channel feed
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`);
                const data = await res.json();
                
                loader.style.display = 'none'; // Hide loader
                
                if (data.items) {
                    videoGrid.innerHTML = data.items.map(item => {
                        const videoId = item.link.split('v=')[1];
                        return `
                            <div class="bg-[#161C28] rounded-2xl overflow-hidden hover:scale-105 transition">
                                <a href="${item.link}" target="_blank">
                                    <img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" class="w-full h-56 object-cover">
                                    <div class="p-5">
                                        <h3 class="font-bold text-lg line-clamp-2">${item.title}</h3>
                                        <p class="text-[#E50914] font-bold mt-3">WATCH NOW →</p>
                                    </div>
                                </a>
                            </div>
                        `;
                    }).join('');
                }
            } catch (err) {
                videoGrid.innerHTML = '<p class="text-center text-gray-400">Could not load videos. Please check back later.</p>';
            }
        }
        fetchVideos();
    </script>
</body>
</html>
